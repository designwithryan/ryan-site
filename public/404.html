<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <script>
    // SPA redirect for GitHub Pages - with loop prevention
    const path = window.location.pathname.replace(/\/$/, '');
    const isFile = path.split('/').pop().includes('.');
    const isRedirecting = window.location.search.includes('from=404');

    if (!isFile && !isRedirecting) {
      // Redirect to index.html with the original path and a flag to prevent loops
      window.location.href = '/?from=404&redirect=' + encodeURIComponent(path);
    }
  </script>
</head>
<body>
  Redirecting...
</body>
</html>
